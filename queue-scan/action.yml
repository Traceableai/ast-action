---
name: Traceable AST Queue Scan
description: "Queue a Traceable AST scan to run on remote runners"
branding:
  icon: 'activity'
  color: 'red'
inputs:
  scan_name:
    required: false
    description: 'Name of the scan'
    default: ''
  scan_id:
    required: false
    description: 'ID of the scan'
    default: ''
  client_scan_token:
    required: true
    description: 'Access token from platform'
  traceable_server:
    required: true
    description: 'Platform URL'
  cli_version:
    required: false
    description: 'CLI version (only matters on first action in job)'
    default: 'latest'
  runner_ids:
    required: false
    description: 'Comma-separated runner IDs. If absent, CLI defaults to any_runner'
    default: ''
  wait:
    required: false
    description: 'Wait for the queued scan to complete before exiting'
    default: 'true'
  wait_timeout:
    required: false
    description: 'Maximum time in minutes to wait for scan completion'
    default: ''
  summary:
    required: false
    description: 'Write scan report to GitHub job summary'
    default: 'true'
  additional_cli_options:
    required: false
    description: 'Freeform string appended to CLI command for advanced flags'
    default: ''
runs:
  using: composite
  steps:
    - name: Download CLI (if missing)
      run: |
        if [ -f "${GITHUB_WORKSPACE}/traceable" ]; then
          echo "CLI binary already exists, skipping download."
        else
          echo "CLI binary not found, downloading..."
          CLI_VERSION="${{ inputs.cli_version }}"
          RAW_ARCH=$(uname -m)
          case "$RAW_ARCH" in
            x86_64)  ARCH="x86_64" ;;
            aarch64|arm64) ARCH="aarch64" ;;
            *) echo "::error::Unsupported architecture: $RAW_ARCH"; exit 1 ;;
          esac
          if [[ "$CLI_VERSION" = *"-rc."* ]]; then
            curl -fsSLo traceableCli.tar.gz "https://downloads.traceable.ai/cli/rc/${CLI_VERSION}/traceable-cli-${CLI_VERSION}-linux-${ARCH}.tar.gz"
          else
            curl -fsSLo traceableCli.tar.gz "https://downloads.traceable.ai/cli/release/${CLI_VERSION}/traceable-cli-${CLI_VERSION}-linux-${ARCH}.tar.gz"
          fi
          tar -xvf traceableCli.tar.gz --directory "${GITHUB_WORKSPACE}"
          rm -f traceableCli.tar.gz
        fi
      shell: bash
    - name: Validate scan identity
      run: |
        if [ -z "${{ inputs.scan_name }}" ] && [ -z "${{ inputs.scan_id }}" ]; then
          echo "::error::At least one of 'scan_name' or 'scan_id' must be provided."
          exit 1
        fi
      shell: bash
    - name: Queue scan
      run: |
        export LC_ALL=en_US.utf-8
        export LANG=en_US.utf-8

        SCAN_IDENTITY=""
        if [ -n "${{ inputs.scan_name }}" ]; then
          SCAN_IDENTITY="--scan-name ${{ inputs.scan_name }}"
        fi
        if [ -n "${{ inputs.scan_id }}" ]; then
          SCAN_IDENTITY="${SCAN_IDENTITY} --scan-id ${{ inputs.scan_id }}"
        fi

        RUNNER_IDS_FLAG=""
        if [ -n "${{ inputs.runner_ids }}" ]; then
          RUNNER_IDS_FLAG="--runner-ids ${{ inputs.runner_ids }}"
        fi

        WAIT_FLAGS=""
        if [ "${{ inputs.wait }}" = "true" ]; then
          WAIT_FLAGS="--wait"
          if [ -n "${{ inputs.wait_timeout }}" ]; then
            WAIT_FLAGS="${WAIT_FLAGS} --wait-timeout ${{ inputs.wait_timeout }}"
          fi
        fi

        CLI_OPTS=$(echo "${{ inputs.additional_cli_options }}" | tr '\n' ' ')

        if [ "${{ inputs.summary }}" = "true" ] && [ "${{ inputs.wait }}" = "true" ]; then
          ${GITHUB_WORKSPACE}/traceable ast scan queue \
            ${SCAN_IDENTITY} \
            --token ${{ inputs.client_scan_token }} \
            --traceable-server ${{ inputs.traceable_server }} \
            ${RUNNER_IDS_FLAG} \
            ${WAIT_FLAGS} \
            ${CLI_OPTS} >> $GITHUB_STEP_SUMMARY
        else
          ${GITHUB_WORKSPACE}/traceable ast scan queue \
            ${SCAN_IDENTITY} \
            --token ${{ inputs.client_scan_token }} \
            --traceable-server ${{ inputs.traceable_server }} \
            ${RUNNER_IDS_FLAG} \
            ${WAIT_FLAGS} \
            ${CLI_OPTS}
        fi
      shell: bash
