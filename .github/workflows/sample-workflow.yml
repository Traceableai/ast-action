---
# Sample workflow demonstrating the Traceable AST v2 actions.
#
# NOTE: These actions are currently on branch v2/overrides-01 and have not
# been merged to main yet. The @v2/overrides-01 ref is intentional.
#
# This file contains two independent jobs:
#   - local-scan  : runs the scan on the GitHub-hosted runner (scan action)
#   - queued-scan : dispatches the scan to a remote Traceable runner (queue-scan action)
#
# Only one of the two patterns is typically needed. Copy the job that fits
# your setup into your own .github/workflows/ file.

name: Traceable AST

on:
  push:
    branches: [v2/overrides-01]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Pattern 1 – Local scan
  # The scan runs directly on the GitHub-hosted runner.
  # ---------------------------------------------------------------------------
  local-scan:
    name: Local AST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan step
        uses: Traceableai/ast-action/scan@v2/overrides-01
        with:
          scan_name: 'souvik-dast-overrides'
          client_scan_token: 'MWMwMGI2MzItOWZkNC00ZGMwLTk0MDgtNWFlZjEzOGJlNjFk'
          traceable_server: 'api-dev.traceable.ai'
          cli_version: '2.8.0-rc.0'
          summary: 'false'             # report action writes the job summary
          additional_cli_options: |
            --target-url https://echo.free.beeceptor.com
            --hook-names souvik_hook,test-souvik

      - name: Report step
        uses: Traceableai/ast-action/report@v2/overrides-01
        with:
          client_scan_token: 'MWMwMGI2MzItOWZkNC00ZGMwLTk0MDgtNWFlZjEzOGJlNjFk'
          traceable_server: 'api-dev.traceable.ai'

      - name: Gate step
        uses: Traceableai/ast-action/gate@v2/overrides-01
        with:
          client_scan_token: 'MWMwMGI2MzItOWZkNC00ZGMwLTk0MDgtNWFlZjEzOGJlNjFk'
          traceable_server: 'api-dev.traceable.ai'

  # ---------------------------------------------------------------------------
  # Pattern 2 – Queued scan
  # The scan is dispatched to one or more remote Traceable runners.
  # ---------------------------------------------------------------------------
  queued-scan:
    name: Queued AST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Queue AST scan
        uses: Traceableai/ast-action/queue-scan@v2/overrides-01
        with:
          scan_name: 'souvik-dast-overrides'
          client_scan_token: 'MWMwMGI2MzItOWZkNC00ZGMwLTk0MDgtNWFlZjEzOGJlNjFk'
          traceable_server: 'api-dev.traceable.ai'
          cli_version: '2.8.0-rc.0'
          wait: 'true'                       # block until the remote scan finishes
          summary: 'false'                   # report action writes the job summary
          additional_cli_options: |
            --target-url https://echo.free.beeceptor.com

      - name: Publish report
        uses: Traceableai/ast-action/report@v2/overrides-01
        with:
          client_scan_token: 'MWMwMGI2MzItOWZkNC00ZGMwLTk0MDgtNWFlZjEzOGJlNjFk'
          traceable_server: 'api-dev.traceable.ai'

      - name: Gate pipeline
        uses: Traceableai/ast-action/gate@v2/overrides-01
        with:
          client_scan_token: 'MWMwMGI2MzItOWZkNC00ZGMwLTk0MDgtNWFlZjEzOGJlNjFk'
          traceable_server: 'api-dev.traceable.ai'
