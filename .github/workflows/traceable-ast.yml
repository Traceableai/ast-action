name: Traceable AST

on:
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Pattern 1 – Local scan
  # The scan runs directly on the GitHub-hosted runner.
  # ---------------------------------------------------------------------------
  local-scan:
    name: Local AST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan step
        uses: Traceableai/ast-action/scan@v2/test-01
        with:
          scan_name: 'souvik-dast-overrides'
          client_scan_token: 'MWMwMGI2MzItOWZkNC00ZGMwLTk0MDgtNWFlZjEzOGJlNjFk'
          traceable_server: 'api-dev.traceable.ai'
          cli_version: '2.8.0-rc.0'
          summary: 'false'             # report action writes the job summary
          additional_cli_options: |
            --target-url https://echo.free.beeceptor.com

      - name: Report step
        uses: Traceableai/ast-action/report@v2/test-01
        with:
          client_scan_token: 'MWMwMGI2MzItOWZkNC00ZGMwLTk0MDgtNWFlZjEzOGJlNjFk'
          traceable_server: 'api-dev.traceable.ai'

      - name: Gate step
        uses: Traceableai/ast-action/gate@v2/test-01
        with:
          client_scan_token: 'MWMwMGI2MzItOWZkNC00ZGMwLTk0MDgtNWFlZjEzOGJlNjFk'
          traceable_server: 'api-dev.traceable.ai'
