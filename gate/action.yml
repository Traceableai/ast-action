---
name: Traceable AST Gate
description: "Run scan evaluation to pass/fail the pipeline"
branding:
  icon: 'activity'
  color: 'red'
inputs:
  id:
    required: false
    description: 'Scan run ID to evaluate (if omitted, CLI reads from .traceable folder)'
    default: ''
  client_scan_token:
    required: true
    description: 'Access token from platform'
  traceable_server:
    required: true
    description: 'Platform URL'
  cli_version:
    required: false
    description: 'CLI version (only matters if CLI not yet downloaded)'
    default: 'latest'
  additional_cli_options:
    required: false
    description: 'Extra CLI flags'
    default: ''
runs:
  using: composite
  steps:
    - name: Download CLI (if missing)
      run: |
        if [ -f "${GITHUB_WORKSPACE}/traceable" ]; then
          echo "CLI binary already exists, skipping download."
        else
          echo "CLI binary not found, downloading..."
          CLI_VERSION="${{ inputs.cli_version }}"
          RAW_ARCH=$(uname -m)
          case "$RAW_ARCH" in
            x86_64)  ARCH="x86_64" ;;
            aarch64|arm64) ARCH="aarch64" ;;
            *) echo "::error::Unsupported architecture: $RAW_ARCH"; exit 1 ;;
          esac
          if [[ "$CLI_VERSION" = *"-rc."* ]]; then
            curl -Lo traceableCli.tar.gz "https://downloads.traceable.ai/cli/rc/${CLI_VERSION}/traceable-cli-${CLI_VERSION}-linux-${ARCH}.tar.gz"
          else
            curl -Lo traceableCli.tar.gz "https://downloads.traceable.ai/cli/release/${CLI_VERSION}/traceable-cli-${CLI_VERSION}-linux-${ARCH}.tar.gz"
          fi
          tar -xvf traceableCli.tar.gz --directory "${GITHUB_WORKSPACE}"
          rm -f traceableCli.tar.gz
        fi
      shell: bash
    - name: Evaluate scan results
      run: |
        export LC_ALL=en_US.utf-8
        export LANG=en_US.utf-8

        ID_FLAG=""
        if [ -n "${{ inputs.id }}" ]; then
          ID_FLAG="--id '${{ inputs.id }}'"
        fi

        CLI_OPTS=$(echo "${{ inputs.additional_cli_options }}" | tr '\n' ' ')

        ${GITHUB_WORKSPACE}/traceable ast scan report \
          --token '${{ inputs.client_scan_token }}' \
          --traceable-server '${{ inputs.traceable_server }}' \
          ${ID_FLAG} \
          ${CLI_OPTS}
      shell: bash
